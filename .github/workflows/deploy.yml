name: Deploy to Railway

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Railway (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://prepless-ai-production.up.railway.app' || 'https://prepless-ai-staging.up.railway.app' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Staging
        if: github.ref_name == 'staging'
        run: railway up --service prepless-ai --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Production
        if: github.ref_name == 'main'
        run: railway up --service prepless-ai --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health Check
        if: github.ref_name == 'main'
        run: |
          sleep 15
          curl -sf https://prepless-ai-production.up.railway.app/api/health || (echo "Health check failed" && exit 1)
