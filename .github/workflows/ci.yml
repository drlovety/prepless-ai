name: CI — Lint + TypeCheck + Test + Smoke

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0 || npx eslint . || echo "ESLint has warnings, not failing"

      - name: Validate env schema
        run: node scripts/validate-env.js || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  smoke:
    name: Smoke Test (Production)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Railway deploy
        run: sleep 30

      - name: Ping health endpoint
        run: |
          curl -sf https://prepless-ai-production.up.railway.app/api/health || (echo "❌ Health check failed" && exit 1)
          echo "✅ Production health check passed"

      - name: Verify auth callback redirects correctly
        run: |
          # Expects 302 redirect, not localhost
          LOC=$(curl -s -I "https://prepless-ai-production.up.railway.app/auth/callback?code=test&next=/dashboard" | grep -i location: | head -1)
          echo "Redirect: $LOC"
          if echo "$LOC" | grep -q "localhost"; then
            echo "❌ Redirect points to localhost!"
            exit 1
          fi
          echo "✅ Auth callback redirect is production-safe"
